name: Publish package with gitpkg
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install package dependencies (bob-widget)
        run: npm ci --prefix packages/bob-widget

      - name: Build bob-widget
        run: npm run build --prefix packages/bob-widget

      - name: Install gitpkg
        run: npm install -g gitpkg

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish with gitpkg (packages/bob-widget)
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          cd packages/bob-widget
          node -e "const p=require('./package.json'); console.log('Publishing', p.name, p.version);"
          gitpkg publish

# Notes:
# - This workflow builds and publishes the package located at packages/bob-widget whenever main is pushed or manually dispatched.
# - It uses the repo's GITHUB_TOKEN to push tags to the same repository. If you want tags pushed to a separate registry repo, we can update the workflow to use a secret PAT/deploy key.
